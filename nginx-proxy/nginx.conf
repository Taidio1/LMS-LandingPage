server {
    listen 80;
    server_name _;

    # LMS app pod /demo-app — proxy do kontenera lms-app
    # Trailing slash w proxy_pass stripuje prefix /demo-app z URL
    location /demo-app/ {
        proxy_pass http://lms-app:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect /demo-app (bez slash) -> /demo-app/
    location = /demo-app {
        return 301 /demo-app/;
    }

    # Landing Page — proxy do kontenera landing-page
    location / {
        proxy_pass http://landing-page:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
