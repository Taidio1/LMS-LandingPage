# Samodzielne uruchomienie TYLKO landing page (dev/lokalnie).
# Do deploymentu produkcyjnego na mikr.us używaj ../docker-compose.yml w root repo,
# który uruchamia landing + LMS app razem na wspolnej sieci.
services:
  landing-page:
    build: .
    container_name: lms-landing-page-standalone
    restart: unless-stopped
    ports:
      # Host 4000 -> Nginx 80
      - "4000:80"
