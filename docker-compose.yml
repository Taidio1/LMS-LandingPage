services:
  nginx-proxy:
    build:
      context: ./nginx-proxy
      dockerfile: Dockerfile
    image: lms-nginx-proxy:latest
    container_name: lms-nginx-proxy
    restart: unless-stopped
    networks:
      - lms_network
    ports:
      # Proxy nasłuchuje na porcie 3000 hosta
      - "3000:80"
    depends_on:
      - landing-page

  landing-page:
    build:
      context: ./Landing_Page
      dockerfile: Dockerfile
    image: lms-landing-page:latest
    container_name: lms-landing-page
    restart: unless-stopped
    # Dane SMTP (Mailgun) — plik trzeba utworzyć na serwerze, nie jest w repo
    env_file:
      - ./Landing_Page/.env
    networks:
      - lms_network
    # Brak publicznych portów — dostęp tylko przez nginx-proxy

networks:
  lms_network:
    name: lms_network
    driver: bridge
