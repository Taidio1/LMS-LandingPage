<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porównywarka Stron — Ascent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-bg:      #0f1117;
      --clr-surface: #1a1d27;
      --clr-border:  #2a2d3e;
      --clr-accent:  #6c63ff;
      --clr-accent2: #ff6584;
      --clr-text:    #e2e8f0;
      --clr-muted:   #64748b;
      --handle-w:    4px;
      --handle-btn:  44px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background: var(--clr-surface);
      border-bottom: 1px solid var(--clr-border);
      height: 56px;
      flex-shrink: 0;
      z-index: 100;
    }

    .header-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap;
    }
    .header-logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-accent), var(--clr-accent2));
      flex-shrink: 0;
    }

    .header-controls {
      display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center;
    }
    .url-group { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .url-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .8px; color: var(--clr-muted);
    }
    .url-label.left  { color: var(--clr-accent); }
    .url-label.right { color: var(--clr-accent2); }
    .url-input {
      background: var(--clr-bg); border: 1px solid var(--clr-border);
      border-radius: 8px; padding: 5px 10px; color: var(--clr-text);
      font-size: 12px; width: 220px; outline: none; transition: border-color .2s;
    }
    .url-input:focus       { border-color: var(--clr-accent); }
    .url-input.right:focus { border-color: var(--clr-accent2); }

    .reload-btn {
      display: flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, var(--clr-accent), #8b5cf6);
      border: none; border-radius: 8px; padding: 7px 14px;
      color: #fff; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: opacity .2s, transform .15s; white-space: nowrap;
    }
    .reload-btn:hover  { opacity: .88; transform: translateY(-1px); }
    .reload-btn:active { transform: translateY(0); }

    .header-info {
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px; white-space: nowrap;
    }
    .split-pct { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .split-pct span { color: var(--clr-accent); }

    /* sync toggle */
    .scroll-sync-toggle {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; font-size: 11px; color: var(--clr-muted); transition: color .2s;
    }
    .scroll-sync-toggle:hover { color: var(--clr-text); }
    .toggle-pill {
      width: 28px; height: 15px; border-radius: 999px;
      background: var(--clr-border); position: relative; transition: background .2s;
    }
    .toggle-pill.on { background: var(--clr-accent); }
    .toggle-pill::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 11px; height: 11px; border-radius: 50%;
      background: white; transition: transform .2s;
    }
    .toggle-pill.on::after { transform: translateX(13px); }

    /* ── LABELS ── */
    .page-labels { display: flex; height: 28px; flex-shrink: 0; pointer-events: none; }
    .page-label {
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; letter-spacing: .5px; overflow: hidden;
    }
    .page-label.left  { background: rgba(108,99,255,.15); color: var(--clr-accent);  border-bottom: 2px solid var(--clr-accent); }
    .page-label.right { background: rgba(255,101,132,.12); color: var(--clr-accent2); border-bottom: 2px solid var(--clr-accent2); }

    /* ── SPLIT CONTAINER ── */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .split-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }

    /* Both panes: full-size, stacked, clipped by clip-path */
    .pane {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    /*
      The iframe is taller than the viewport so translateY has room.
      8000px covers any landing page.
      pointer-events: none → we intercept all interaction at the scroll-overlay level.
    */
    .pane iframe {
      width: 100%;
      height: 8000px;
      border: none;
      display: block;
      pointer-events: none;   /* scroll overlay handles all events */
      will-change: transform;
      transform: translateY(0);
    }

    /* ── SCROLL OVERLAY ── */
    /*
      Sits on top of both iframes, captures wheel + touch scroll.
      pointer-events: all so it intercepts the wheel.
      But we let mouse through for the divider (divider is z-index:50, overlay z-index:10).
    */
    .scroll-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: ns-resize;
    }

    /* scroll position indicator — pill in bottom-left */
    .scroll-indicator {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26,29,39,.85);
      border: 1px solid var(--clr-border);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 11px;
      color: var(--clr-muted);
      z-index: 60;
      pointer-events: none;
      backdrop-filter: blur(8px);
      font-variant-numeric: tabular-nums;
      opacity: 0;
      transition: opacity .3s;
    }
    .scroll-indicator.visible { opacity: 1; }

    /* ── DIVIDER ── */
    .divider {
      position: absolute;
      top: 0; bottom: 0;
      width: var(--handle-w);
      background: #fff;
      cursor: ew-resize;
      z-index: 50;
      transform: translateX(-50%);
      box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 16px rgba(108,99,255,.6);
      transition: box-shadow .2s;
    }
    .divider:hover,
    .divider.dragging { box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 28px rgba(108,99,255,1); }

    .divider-handle {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: var(--handle-btn); height: var(--handle-btn);
      background: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      cursor: ew-resize; transition: transform .15s;
    }
    .divider:hover .divider-handle,
    .divider.dragging .divider-handle { transform: translate(-50%,-50%) scale(1.1); }
    .divider-arrows { color: var(--clr-bg); font-size: 14px; font-weight: 900; }

    /* drag blocker — only used during horizontal drag so wheel overlay stays on */
    .drag-blocker {
      position: absolute; inset: 0; z-index: 45; display: none;
    }
    .drag-blocker.active { display: block; }

    /* loading */
    .loading-badge {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: var(--clr-surface); border: 1px solid var(--clr-border);
      border-radius: 999px; padding: 5px 14px; font-size: 11px; color: var(--clr-muted);
      display: none; z-index: 70; animation: fadein .3s ease;
    }
    .loading-badge.visible { display: block; }
    @keyframes fadein {
      from { opacity:0; transform: translateX(-50%) translateY(6px); }
      to   { opacity:1; transform: translateX(-50%) translateY(0); }
    }

    /* key hints */
    .key-hints {
      position: fixed; bottom: 14px; right: 16px;
      display: flex; gap: 8px; z-index: 200;
      opacity: .6; transition: opacity .2s;
    }
    .key-hints:hover { opacity: 1; }
    .key-hint {
      background: var(--clr-surface); border: 1px solid var(--clr-border);
      border-radius: 6px; padding: 4px 9px; font-size: 10px; color: var(--clr-muted);
      display: flex; align-items: center; gap: 4px;
    }
    .key-hint kbd {
      font-family: inherit; font-size: 10px;
      background: var(--clr-border); border-radius: 3px; padding: 1px 5px; color: var(--clr-text);
    }
  </style>
</head>
<body>

<header>
  <div class="header-logo">
    <div class="header-logo-dot"></div>
    Porównywarka
  </div>

  <div class="header-controls">
    <div class="url-group">
      <span class="url-label left">⬅ STARA WERSJA</span>
      <input id="urlLeft" class="url-input" type="url" value="https://ascent.tojest.dev" spellcheck="false" />
    </div>

    <button class="reload-btn" id="reloadBtn">↺ Odśwież</button>

    <div class="url-group">
      <span class="url-label right">NOWA WERSJA ➡</span>
      <input id="urlRight" class="url-input right" type="url" value="https://ascent2.tojest.dev" spellcheck="false" />
    </div>
  </div>

  <div class="header-info">
    <div class="split-pct"><span id="pctDisplay">50</span>%</div>
    <label class="scroll-sync-toggle" id="syncToggle" title="Synchroniczne przewijanie (S)">
      <span class="toggle-pill on" id="syncPill"></span>
      Sync scroll
    </label>
  </div>
</header>

<div class="main-area">
  <div class="page-labels">
    <div class="page-label left"  id="labelLeft">ascent.tojest.dev</div>
    <div class="page-label right" id="labelRight">ascent2.tojest.dev</div>
  </div>

  <div class="split-container" id="splitContainer">

    <!-- LEFT PANE -->
    <div class="pane" id="paneLeft">
      <iframe id="iframeLeft" src="https://ascent.tojest.dev" title="Stara wersja"></iframe>
    </div>

    <!-- RIGHT PANE -->
    <div class="pane" id="paneRight">
      <iframe id="iframeRight" src="https://ascent2.tojest.dev" title="Nowa wersja"></iframe>
    </div>

    <!-- SCROLL OVERLAY — captures wheel/touch, sits below divider -->
    <div class="scroll-overlay" id="scrollOverlay"></div>

    <!-- DRAG BLOCKER — only active during horizontal divider drag -->
    <div class="drag-blocker" id="dragBlocker"></div>

    <!-- DIVIDER -->
    <div class="divider" id="divider">
      <div class="divider-handle">
        <div class="divider-arrows">◀ ▶</div>
      </div>
    </div>

    <div class="scroll-indicator" id="scrollIndicator">↕ 0 px</div>
    <div class="loading-badge"    id="loadingBadge">⟳ Ładowanie…</div>
  </div>
</div>

<div class="key-hints">
  <div class="key-hint"><kbd>R</kbd> odśwież</div>
  <div class="key-hint"><kbd>← →</kbd> suwak</div>
  <div class="key-hint"><kbd>S</kbd> sync scroll</div>
  <div class="key-hint"><kbd>5</kbd> wyśrodkuj</div>
  <div class="key-hint"><kbd>Home</kbd> góra</div>
</div>

<script>
  /* ─────────────────────────── STATE ─────────────────────────── */
  let splitPct       = 50;
  let isDragging     = false;
  let syncScroll     = true;
  let virtualScrollY = 0;           // shared scroll position (px)
  let scrollHideTimer;
  const MAX_SCROLL   = 7200;        // iframe height 8000 minus viewport ~800

  /* ─────────────────────────── ELEMENTS ──────────────────────── */
  const container       = document.getElementById('splitContainer');
  const paneLeft        = document.getElementById('paneLeft');
  const paneRight       = document.getElementById('paneRight');
  const iframeLeft      = document.getElementById('iframeLeft');
  const iframeRight     = document.getElementById('iframeRight');
  const divider         = document.getElementById('divider');
  const scrollOverlay   = document.getElementById('scrollOverlay');
  const dragBlocker     = document.getElementById('dragBlocker');
  const pctDisplay      = document.getElementById('pctDisplay');
  const labelLeft       = document.getElementById('labelLeft');
  const labelRight      = document.getElementById('labelRight');
  const reloadBtn       = document.getElementById('reloadBtn');
  const urlLeft         = document.getElementById('urlLeft');
  const urlRight        = document.getElementById('urlRight');
  const syncPill        = document.getElementById('syncPill');
  const syncToggle      = document.getElementById('syncToggle');
  const loadingBadge    = document.getElementById('loadingBadge');
  const scrollIndicator = document.getElementById('scrollIndicator');

  /* ─────────────────────────── SPLIT LAYOUT ──────────────────── */
  function applySplit(pct) {
    splitPct = Math.max(5, Math.min(95, pct));
    const w     = container.getBoundingClientRect().width;
    const leftW = w * splitPct / 100;
    const rightW = w - leftW;

    // Clip each pane — iframes inside always render at full width
    paneLeft.style.clipPath  = `inset(0 ${rightW}px 0 0)`;
    paneRight.style.clipPath = `inset(0 0 0 ${leftW}px)`;

    divider.style.left      = leftW + 'px';
    labelLeft.style.width   = leftW  + 'px';
    labelRight.style.width  = rightW + 'px';
    pctDisplay.textContent  = Math.round(splitPct);
  }

  window.addEventListener('resize', () => applySplit(splitPct));

  /* ─────────────────────────── SCROLL ────────────────────────── */
  function applyScroll() {
    const y = -virtualScrollY;
    iframeLeft.style.transform  = `translateY(${y}px)`;
    iframeRight.style.transform = `translateY(${y}px)`;

    // Show indicator
    scrollIndicator.textContent = `↕ ${Math.round(virtualScrollY)} px`;
    scrollIndicator.classList.add('visible');
    clearTimeout(scrollHideTimer);
    scrollHideTimer = setTimeout(() => scrollIndicator.classList.remove('visible'), 1200);
  }

  function scrollBy(deltaY) {
    if (!syncScroll) return;
    virtualScrollY = Math.max(0, Math.min(MAX_SCROLL, virtualScrollY + deltaY));
    applyScroll();
  }

  /* Wheel — intercept on the scroll overlay (sits above iframes) */
  scrollOverlay.addEventListener('wheel', e => {
    e.preventDefault();
    e.stopPropagation();
    // Normalize: trackpad sends small deltas, mouse wheel sends 100+
    const delta = e.deltaMode === 1
      ? e.deltaY * 20     // DOM_DELTA_LINE
      : e.deltaMode === 2
        ? e.deltaY * 400  // DOM_DELTA_PAGE
        : e.deltaY;       // DOM_DELTA_PIXEL
    scrollBy(delta);
  }, { passive: false });

  /* Touch scroll */
  let lastTouchY = null;
  scrollOverlay.addEventListener('touchstart', e => {
    lastTouchY = e.touches[0].clientY;
  }, { passive: true });
  scrollOverlay.addEventListener('touchmove', e => {
    if (lastTouchY === null) return;
    const dy = lastTouchY - e.touches[0].clientY;
    lastTouchY = e.touches[0].clientY;
    scrollBy(dy);
  }, { passive: true });
  scrollOverlay.addEventListener('touchend', () => { lastTouchY = null; });

  /* ─────────────────────────── DIVIDER DRAG ──────────────────── */
  function startDrag(clientX) {
    isDragging = true;
    divider.classList.add('dragging');
    dragBlocker.classList.add('active');   // block iframes during horizontal drag
    moveDrag(clientX);
  }
  function moveDrag(clientX) {
    if (!isDragging) return;
    const rect = container.getBoundingClientRect();
    const pct  = ((clientX - rect.left) / rect.width) * 100;
    applySplit(pct);
  }
  function endDrag() {
    isDragging = false;
    divider.classList.remove('dragging');
    dragBlocker.classList.remove('active');
  }

  divider.addEventListener('mousedown',  e => { e.preventDefault(); startDrag(e.clientX); });
  divider.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e.touches[0].clientX); }, { passive: false });
  document.addEventListener('mousemove', e => moveDrag(e.clientX));
  document.addEventListener('mouseup',   endDrag);
  document.addEventListener('touchmove', e => { if (isDragging) moveDrag(e.touches[0].clientX); }, { passive: true });
  document.addEventListener('touchend',  endDrag);

  /* ─────────────────────────── RELOAD ────────────────────────── */
  function reload() {
    // Reset scroll position
    virtualScrollY = 0;
    applyScroll();

    showLoading();
    iframeLeft.src  = urlLeft.value  || iframeLeft.src;
    iframeRight.src = urlRight.value || iframeRight.src;
    try { labelLeft.textContent  = new URL(urlLeft.value).host;  } catch(_) { labelLeft.textContent  = urlLeft.value;  }
    try { labelRight.textContent = new URL(urlRight.value).host; } catch(_) { labelRight.textContent = urlRight.value; }
  }

  function showLoading() { loadingBadge.classList.add('visible'); setTimeout(hideLoading, 8000); }
  function hideLoading()  { loadingBadge.classList.remove('visible'); }

  iframeLeft.addEventListener('load',  hideLoading);
  iframeRight.addEventListener('load', hideLoading);

  reloadBtn.addEventListener('click', reload);
  urlLeft.addEventListener('keydown',  e => { if (e.key === 'Enter') reload(); });
  urlRight.addEventListener('keydown', e => { if (e.key === 'Enter') reload(); });

  /* ─────────────────────────── SYNC TOGGLE ───────────────────── */
  syncToggle.addEventListener('click', () => {
    syncScroll = !syncScroll;
    syncPill.classList.toggle('on', syncScroll);
    // When re-enabling sync, snap right iframe to same position
    if (syncScroll) applyScroll();
  });

  /* ─────────────────────────── KEYBOARD ──────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'r' || e.key === 'R')         reload();
    if (e.key === 'ArrowLeft')                   applySplit(splitPct - 5);
    if (e.key === 'ArrowRight')                  applySplit(splitPct + 5);
    if (e.key === '5')                           applySplit(50);
    if (e.key === 'Home')                        { virtualScrollY = 0; applyScroll(); }
    if (e.key === 'End')                         { virtualScrollY = MAX_SCROLL; applyScroll(); }
    if (e.key === 'ArrowUp')                     scrollBy(-60);
    if (e.key === 'ArrowDown')                   scrollBy(60);
    if (e.key === 'PageUp')                      scrollBy(-window.innerHeight * 0.9);
    if (e.key === 'PageDown')                    scrollBy(window.innerHeight * 0.9);
    if (e.key === 's' || e.key === 'S') {
      syncScroll = !syncScroll;
      syncPill.classList.toggle('on', syncScroll);
      if (syncScroll) applyScroll();
    }
  });

  /* ─────────────────────────── INIT ──────────────────────────── */
  const params = new URLSearchParams(window.location.search);
  if (params.get('left'))  urlLeft.value  = params.get('left');
  if (params.get('right')) urlRight.value = params.get('right');
  iframeLeft.src  = urlLeft.value;
  iframeRight.src = urlRight.value;

  applySplit(50);
  try { labelLeft.textContent  = new URL(urlLeft.value).host;  } catch(_) {}
  try { labelRight.textContent = new URL(urlRight.value).host; } catch(_) {}
</script>
</body>
</html>
